services:
    backend:
        build:
            context: .
        image: ${TAKT_IMAGE:-takt-backend:latest}
        restart: unless-stopped
        init: true
        environment:
            DB_FILE_NAME: file:/data/takt.db
            HOST: 0.0.0.0
            PORT: 3000
            AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN must be set}
        ports:
            - '${TAKT_PORT:-3011}:3000'
        volumes:
            - takt-data:/data

    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
            args:
                VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        image: ${TAKT_FRONTEND_IMAGE:-takt-frontend:latest}
        restart: unless-stopped
        ports:
            - '${TAKT_FRONTEND_PORT:-3000}:3000'

volumes:
    takt-data:
