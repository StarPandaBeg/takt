name: Docker

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docker-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build pull request image (${{ matrix.app.name }})
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                app:
                    - name: backend
                      file: ./Dockerfile
                      cache-scope: takt-linux-amd64
                    - name: frontend
                      file: ./Dockerfile.frontend
                      cache-scope: takt-frontend-linux-amd64
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.app.file }}
                  platforms: linux/amd64
                  push: false
                  cache-from: type=gha,scope=${{ matrix.app.cache-scope }}-pr-${{ github.event.pull_request.number }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.app.cache-scope }}-pr-${{ github.event.pull_request.number }}

    publish:
        name: Build and publish image (${{ matrix.app.name }})
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                app:
                    - name: backend
                      file: ./Dockerfile
                      image-suffix: ''
                      cache-scope: takt-linux-amd64
                    - name: frontend
                      file: ./Dockerfile.frontend
                      image-suffix: -frontend
                      cache-scope: takt-frontend-linux-amd64
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Normalize image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.app.image-suffix }}" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                      type=ref,event=tag
                      type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.app.file }}
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.app.cache-scope }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.app.cache-scope }}
